trigger:
- main

variables:
  buildConfiguration: 'Release'
  projectPath: '**/*.csproj'
  artifactName: 'drop'
  publishDir: '$(Build.ArtifactStagingDirectory)\publish'
  devIisPath: 'C:\Temp\PublishDev'
  testIisPath: 'C:\Temp\PublishTest'
  devAppPool: 'naval-dev-pool'
  testAppPool: 'naval-test-pool'

stages:
- stage: Build
  displayName: Build and Publish Artifact
  jobs:
  - job: BuildJob
    pool:
      name: naval-dev-pool
      demands:
      - Agent.Name -equals devagent
    steps:
    - checkout: self
    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      displayName: Install required package
      inputs:
       restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: Build with MSBuild
      inputs:
        solution: 'DashBoard_MVC/DashBoard_MVC.csproj'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:publishUrl=$(Build.ArtifactStagingDirectory)\publish /p:DeleteExistingFiles=True'
        platform: 'Any CPU'
        configuration: 'Release'    

    - task: PublishPipelineArtifact@1
      displayName: Publish Pipeline Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\publish'
        artifact: 'drop'

- stage: Deploy_Dev
  displayName: Deploy to Dev VM IIS
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployDev
    displayName: Deploy Dev
    pool:
      name: naval-dev-pool
      demands:
      - Agent.Name -equals devagent
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: '$(artifactName)'

          - powershell: |
              Import-Module WebAdministration
              Stop-WebAppPool -Name "$(devAppPool)"
            displayName: Stop Dev App Pool

          - powershell: |
              $source = "$(Pipeline.Workspace)\$(artifactName)\*"
              $destination = "$(devIisPath)"
              if (!(Test-Path $destination)) {
                New-Item -ItemType Directory -Path $destination -Force | Out-Null
              }
              Remove-Item "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
              Copy-Item $source $destination -Recurse -Force
            displayName: Copy Files to Dev IIS Folder

          - powershell: |
              Import-Module WebAdministration
              Start-WebAppPool -Name "$(devAppPool)"
            displayName: Start Dev App Pool

- stage: Deploy_Test
  displayName: Deploy to Test VM IIS
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployTest
    displayName: Deploy Test
    pool:
      name: naval-test-pool
      demands:
      - Agent.Name -equals testagent
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: '$(artifactName)'

          - powershell: |
              Import-Module WebAdministration
              Stop-WebAppPool -Name "$(testAppPool)"
            displayName: Stop Test App Pool

          - powershell: |
              $source = "$(Pipeline.Workspace)\$(artifactName)\*"
              $destination = "$(testIisPath)"
              if (!(Test-Path $destination)) {
                New-Item -ItemType Directory -Path $destination -Force | Out-Null
              }
              Remove-Item "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
              Copy-Item $source $destination -Recurse -Force
            displayName: Copy Files to Test IIS Folder

          - powershell: |
              Import-Module WebAdministration
              Start-WebAppPool -Name "$(testAppPool)"
            displayName: Start Test App Pool